<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vulnerable Bank{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 40px auto; padding: 0 18px; line-height: 1.5; }
        nav a { margin-right: 12px; }
        .card { border: 1px solid #ccc; padding: 16px; margin: 14px 0; border-radius: 6px; }
        .error { color: #a00; }
        input, textarea { width: 100%; max-width: 600px; padding: 8px; margin: 5px 0 12px; box-sizing: border-box; }
        button { padding: 8px 14px; }
        code { background: #f1f1f1; padding: 2px 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'note_search' %}">Note search</a>
    <a href="{% url 'comments' %}">Comments</a>
    <a href="{% url 'crash' %}">Crash demo</a>
    {% if user.is_authenticated %}
        <a href="{% url 'account_detail' user.username %}">My account</a>
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
</nav>
<hr>
{% block content %}{% endblock %}
</body>
</html>
